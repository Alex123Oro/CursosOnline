<header class="topbar">
  <h1>Cursos de formación continua</h1>
  <button class="primary-btn" (click)="openCreateForm()">+ Nuevo curso</button>
</header>

@if (feedback()) {
  <div class="app-feedback">{{ feedback() }}</div>
}

<app-course-list
  [courses]="courses()"
  [loading]="isLoading()"
  (editCourse)="openEditForm($event)">
</app-course-list>

@if (isFormOpen()) {
  <app-course-form
    [mode]="formMode()"
    [course]="editingCourse()"
    [saving]="isSaving()"
    (save)="handleSave($event)"
    (cancel)="closeForm()">
  </app-course-form>
}
