<header class="catalog-header">
  <a class="catalog-brand" routerLink="/catalogo" aria-label="EVA, cursos disponibles"><span class="brand-mark" aria-hidden="true">E</span><span>EVA</span></a>
  <div class="header-tools">
    <span class="catalog-header-label">{{ label() }}</span>
    <label class="session-select">
      <span>Sesión</span>
      <select [value]="session.userId()" (change)="onSessionChange($any($event.target).value)">
        <optgroup label="Usuarios">
          @for (user of session.baseSessionUsers(); track user.id) { <option [value]="user.id" [selected]="user.id === session.userId()">{{ user.name }}</option> }
        </optgroup>
        <optgroup label="Instructores">
          @for (user of session.instructorSessionUsers(); track user.id) { <option [value]="user.id" [selected]="user.id === session.userId()">{{ user.name }}</option> }
        </optgroup>
      </select>
    </label>
  </div>
</header>
