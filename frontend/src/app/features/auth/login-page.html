<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <a class="login-brand" routerLink="/catalogo"><span class="brand-mark" aria-hidden="true">E</span><span>EVA</span></a>
    <p class="eyebrow">FORMACIÓN CONTINUA</p>
    <h1 id="login-title">Iniciar sesión</h1>
    <p class="login-subtitle">Accede con la cuenta registrada para continuar.</p>

    @if (feedback()) {
      <p class="login-error" role="alert">{{ feedback() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Correo electrónico</span>
        <input type="email" autocomplete="username" formControlName="email" placeholder="nombre@correo.com">
        @if (form.controls.email.touched && form.controls.email.invalid) { <small>Ingresa un correo válido.</small> }
      </label>
      <label>
        <span>Contraseña</span>
        <input type="password" autocomplete="current-password" formControlName="password" placeholder="Contraseña">
        @if (form.controls.password.touched && form.controls.password.invalid) { <small>La contraseña es obligatoria.</small> }
      </label>
      <button type="submit" [disabled]="submitting()">{{ submitting() ? 'Validando...' : 'Entrar' }}</button>
    </form>
    <a class="catalog-link" routerLink="/catalogo">Volver al catálogo</a>
  </section>
</main>
